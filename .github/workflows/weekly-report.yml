name: 주간 부동산 보고서 자동 생성

on:
  schedule:
    # 매주 금요일 16:00 KST (GitHub cron은 UTC 기준 → 금요일 07:00 UTC)
    - cron: '0 7 * * 5'
  workflow_dispatch: {}
  push:
    paths:
      - 'scripts/data/**'
      - 'scripts/*.js'
      - 'scripts/*.py'
      - 'scripts/run_weekly.sh'

permissions:
  contents: write

concurrency:
  group: weekly-report
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존성 설치
        run: |
          npm ci --prefix scripts
          pip install -r scripts/requirements.txt

      - name: 보고서 생성 (Word + Excel)
        run: bash scripts/run_weekly.sh

      - name: 결과 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/weekly
          if git diff --cached --quiet; then
            echo "변경 없음 (데이터 기준일이 같으면 동일 결과)"
          else
            git commit -m "주간 보고서 자동 생성: $(date -u -d '+9 hours' +%Y-%m-%d) KST"
            git push
          fi
